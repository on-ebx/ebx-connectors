# Failures: cause and next action (audit C-38)
error.detail = Technical detail
error.PRIVATE_ADDRESS.cause = The connection points to a private, loopback or unresolvable address, which this instance refuses by default.
error.PRIVATE_ADDRESS.action = Ask an administrator to add the host to {0} (or to name it in the list of allowed hosts), then run again.
error.HOST_NOT_ALLOWED.cause = The host of the connection is not in the list of hosts the connections may call.
error.HOST_NOT_ALLOWED.action = Ask an administrator to add the host to {0}, then run again.
error.CLEAR_SECRET.cause = A secret of the connection is stored in clear text, which this instance refuses by default.
error.CLEAR_SECRET.action = Replace the value by a vault:, env: or file: reference in the connection, then run again. On a test instance only, an administrator can set {0}=true.
error.RUN_ALREADY_RUNNING.cause = This mapping is already running. Nothing was started.
error.RUN_ALREADY_RUNNING.action = Wait for the current run to end, or stop it from its run panel, then start again.
error.TOO_MANY_RUNS.cause = The instance already runs, or has queued, as many background runs as it allows. Nothing was started.
error.TOO_MANY_RUNS.action = Start again once a run has finished, or ask an administrator to raise {0}.
error.CONNECTION_REFUSED.cause = The remote system accepted no connection on that address and port.
error.CONNECTION_REFUSED.action = Check the address and the port of the connection and that the remote system is up, then test the connection.
error.HOST_UNKNOWN.cause = The host name of the connection could not be resolved.
error.HOST_UNKNOWN.action = Check the host name of the connection (spelling, DNS, proxy), then test the connection.
error.TIMEOUT.cause = The remote system did not answer in time.
error.TIMEOUT.action = Run again later. If it keeps happening, check the network path and the load of the remote system.
error.AUTH_REFUSED.cause = The remote system refused the credentials of the connection, or the rights they give.
error.AUTH_REFUSED.action = Check the user, password, key or token of the connection and the rights it grants, then test the connection.
error.RATE_LIMITED.cause = The remote system asked to slow down (too many requests).
error.RATE_LIMITED.action = Run again later, or reduce the volume of the run (a lower maximum, narrower inputs).
error.MAPPING_INVALID.cause = The mapping asks for something its connection or its operation cannot do.
error.MAPPING_INVALID.action = Open the mapping in the designer and fix what the technical detail names (direction, operation, incremental settings).
access.denied = Access denied: {0} requires the Connectors right {1}. An EBX administrator gives it to one of your roles in the table ''Access rights'' of the Connectors dataset (the role ''{2}'' has it by default).
access.right.READ = READ
access.right.RUN = RUN
access.right.MANAGE = MANAGE
error.ACCESS_DENIED.cause = Your session does not hold the Connectors right this action asks.
error.ACCESS_DENIED.action = Ask an EBX administrator to give one of your roles that right in the table ''Access rights'' of the Connectors dataset, then try again.
error.UNKNOWN.cause = The operation failed.
error.UNKNOWN.action = Read the technical detail below. An administrator finds the full trace in the kernel log.

