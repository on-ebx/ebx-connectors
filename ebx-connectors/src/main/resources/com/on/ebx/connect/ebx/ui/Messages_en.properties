# ---- Credential guide of the connector form (ConnectorCredentialsPane) ----
credentials.legend            = Fields:
credentials.state.required    = required
credentials.state.optional    = optional
credentials.state.derived     = derived
credentials.state.unused      = not used
credentials.unusedPlaceholder = Not used with this mode
credentials.encrypted         = Encrypted when saved
credentials.counter           = {0} / {1} characters
credentials.tooLong           = Too long for this field
credentials.ready.endpoint    = Endpoint
credentials.ready.credentials = Credentials complete
credentials.ready.missing     = Credentials: missing {0}
credentials.ready.none        = No credential required
credentials.mode.notOffered   = Not offered by this connector type
credentials.guide.title       = What to enter
credentials.guide.help        = Field by field, for the selected mode
credentials.guide.none        = Nothing to enter: no credential is sent with this mode.
credentials.obtain.title      = Where to get it
credentials.obtain.help       = At the provider, before coming back here
credentials.obtain.none       = See the provider's documentation for this connector type.
credentials.obtain.nothing    = Nothing to obtain.
credentials.send.title        = How the module authenticates
credentials.send.help         = What actually goes over the network
credentials.props.title       = Expected properties
credentials.props.help        = ConnectorProperty table, key = value
credentials.props.configured  = configured

credentials.mode.NONE.name    = None
credentials.mode.NONE.short   = Public API, or a key managed by the connection
credentials.mode.NONE.desc    = No credential is added to the requests. Some connector types stay on "None" while reading a key in "API key / token" and sending it their own way: the guide says so.
credentials.mode.NONE.send    = The request goes out as is.
credentials.mode.NONE.code    = GET /resource\nHost: configured endpoint
credentials.mode.BASIC.name   = HTTP Basic
credentials.mode.BASIC.short  = User name + password
credentials.mode.BASIC.desc   = The user name / password pair is base64-encoded and sent in the Authorization header on every call. It is also the mode of the databases (SQL account).
credentials.mode.BASIC.step.1.title = The technical account
credentials.mode.BASIC.step.1.text  = A user dedicated to the module, not a personal account.
credentials.mode.BASIC.step.2.title = Its password
credentials.mode.BASIC.step.2.text  = Stored encrypted; enter it again after a change at the provider.
credentials.mode.BASIC.send   = On every call, with no token and no prior exchange.
credentials.mode.BASIC.code   = Authorization: Basic base64(user name:password)
credentials.mode.API_KEY_HEADER.name  = API key in a header
credentials.mode.API_KEY_HEADER.short = Header name + key
credentials.mode.API_KEY_HEADER.desc  = The key is sent as is, on every call, in the HTTP header whose name you give. The name depends on the provider: X-API-Key, x-api-key, Ocp-Apim-Subscription-Key, apikey...
credentials.mode.API_KEY_HEADER.step.1.title = The header name
credentials.mode.API_KEY_HEADER.step.1.text  = Exactly as the API documentation writes it; some providers are case-sensitive.
credentials.mode.API_KEY_HEADER.step.2.title = The key
credentials.mode.API_KEY_HEADER.step.2.text  = A long-lived key, without any "Bearer" prefix.
credentials.mode.API_KEY_HEADER.send  = The key never changes; revoke it at the provider to disable it.
credentials.mode.API_KEY_HEADER.code  = {apiKeyHeader}: ************
credentials.mode.BEARER.name  = Bearer token
credentials.mode.BEARER.short = A token obtained elsewhere, static
credentials.mode.BEARER.desc  = You paste a token obtained elsewhere (private app token, personal access token...). The module sends it as Authorization: Bearer and never renews it.
credentials.mode.BEARER.step.1.title = The token, without "Bearer"
credentials.mode.BEARER.step.1.text  = A permanent or long-lived token. A session token (Entra, Salesforce) expires within one or two hours: prefer OAuth 2.0 then.
credentials.mode.BEARER.warn  = warn|This mode suits permanent tokens. A token that expires stops working without notice, and this field takes 255 characters: an Entra token has 1,500 to 2,500.
credentials.mode.BEARER.send  = The token goes out as is; once it expires, calls answer 401 until you paste a new one.
credentials.mode.BEARER.code  = Authorization: Bearer ************
credentials.mode.OAUTH2.name  = OAuth 2.0
credentials.mode.OAUTH2.short = The module obtains the token itself
credentials.mode.OAUTH2.desc  = You give the identity of the application (client id + secret) and the token endpoint. The module requests a token, caches it and renews it one minute before it expires. This is the durable mode for Microsoft, Salesforce, Databricks, D&B...
credentials.mode.OAUTH2.step.1.title = The application id
credentials.mode.OAUTH2.step.1.text  = Property `clientId`. Public, it shows in the provider's console.
credentials.mode.OAUTH2.step.2.title = The client secret
credentials.mode.OAUTH2.step.2.text  = In "API key / token", encrypted. It is not a token: the module uses it to obtain one.
credentials.mode.OAUTH2.step.3.title = The token endpoint
credentials.mode.OAUTH2.step.3.text  = Property `oauth.tokenUrl`. Some types derive it (tenantId at Microsoft): it then shows as derived.
credentials.mode.OAUTH2.send  = An exchange with the authorization server, then the token obtained on every call. A 401 answer invalidates the cache and the call is retried once.
credentials.mode.OAUTH2.code  = POST {oauth.tokenUrl}\ngrant_type=client_credentials&client_id={clientId}&client_secret=****&scope=...\n\n-> Authorization: Bearer <access_token>   (cached, renewed 1 min before expiry)

credentials.flow.password.step.1.title = The user of the password flow
credentials.flow.password.step.1.text  = The account the token is issued for.
credentials.flow.password.step.2.title = Its password
credentials.flow.password.step.2.text  = Sent to the token endpoint, never to the API.
credentials.flow.password.code = POST {oauth.tokenUrl}\ngrant_type=password&username=...&password=****&client_id={clientId}&client_secret=****\n\n-> Authorization: Bearer <access_token>
credentials.flow.refresh_token.step.1.title = The refresh token
credentials.flow.refresh_token.step.1.text  = Property `oauth.refreshToken`, obtained once through a user consent; the module derives access tokens from it.
credentials.flow.refresh_token.code = POST {oauth.tokenUrl}\ngrant_type=refresh_token&refresh_token=****&client_id={clientId}&client_secret=****\n\n-> Authorization: Bearer <access_token>
credentials.flow.jwt_bearer.step.1.title = The RSA private key
credentials.flow.jwt_bearer.step.1.text  = Property `oauth.privateKey` (PKCS#8 PEM, or a vault:/file: reference). The module signs a JWT assertion itself; no shared secret.
credentials.flow.jwt_bearer.step.2.title = The subject (optional)
credentials.flow.jwt_bearer.step.2.text  = User name on whose behalf the assertion is issued (`oauth.subject` otherwise).
credentials.flow.jwt_bearer.code = POST {oauth.tokenUrl}\ngrant_type=urn:ietf:params:oauth:grant-type:jwt-bearer&assertion=<JWT signed RS256>\n\n-> Authorization: Bearer <access_token>

credentials.field.apiKey.API_KEY_HEADER = API key
credentials.field.apiKey.BEARER         = Token
credentials.field.apiKey.OAUTH2         = Client secret
credentials.field.apiKey.NONE           = Secret read by the connection
credentials.field.username.OAUTH2       = OAuth user

credentials.prop.oauth.flow         = OAuth flow: client_credentials (default), password, refresh_token, jwt_bearer
credentials.prop.oauth.tokenUrl     = Token endpoint of the provider
credentials.prop.clientId           = Application identifier (client id)
credentials.prop.oauth.scope        = Requested scope; empty when the provider needs none
credentials.prop.oauth.refreshToken = Refresh token obtained at the initial consent
credentials.prop.oauth.privateKey   = PKCS#8 private key in PEM, or a vault: / file: reference
credentials.prop.tenantId           = Microsoft Entra tenant id (Directory ID)
credentials.prop.jndi               = JNDI name of a Tomcat DataSource: replaces the URL and the account
credentials.prop.security.protocol  = SASL_SSL (default when an account is set), SASL_PLAINTEXT, PLAINTEXT
credentials.prop.sasl.mechanism     = PLAIN (default) or SCRAM-SHA-256
credentials.prop.apiVersion         = REST API version

credentials.type.powerbi.hint = This type handles its own Microsoft Entra OAuth: give the tenant and the application, it derives the rest.
credentials.type.powerbi.OAUTH2.apiKey = Client secret of the service principal
credentials.type.powerbi.OAUTH2.step.1.title = The tenant
credentials.type.powerbi.OAUTH2.step.1.text  = Property `tenantId`: Entra ID > Overview > Tenant ID.
credentials.type.powerbi.OAUTH2.step.2.title = The application
credentials.type.powerbi.OAUTH2.step.2.text  = Property `clientId`: the Application (client) ID of the app registration.
credentials.type.powerbi.OAUTH2.step.3.title = The client secret
credentials.type.powerbi.OAUTH2.step.3.text  = The Value copied when the secret was created (not the Secret ID).
credentials.type.powerbi.OAUTH2.obtain.1 = portal.azure.com > Microsoft Entra ID > App registrations > New registration (single tenant): note the Application (client) ID.
credentials.type.powerbi.OAUTH2.obtain.2 = Certificates & secrets > New client secret: copy the Value at once.
credentials.type.powerbi.OAUTH2.obtain.3 = Create an Entra security group and add the service principal to it.
credentials.type.powerbi.OAUTH2.obtain.4 = app.powerbi.com > Admin portal > Tenant settings: allow that group for "Service principals can use Fabric APIs" and the three Admin API settings (read-only, detailed metadata, DAX and mashup expressions).
credentials.type.powerbi.OAUTH2.obtain.5 = Add the service principal as a member of every workspace to catalog.
credentials.type.powerbi.OAUTH2.obtain.note = Allow 15 minutes for tenant settings to propagate. "My workspace" stays out of reach of a service principal.
credentials.type.powerbi.BEARER.step.1.title = A user Entra token
credentials.type.powerbi.BEARER.step.1.text  = For example `az account get-access-token --resource https://analysis.windows.net/powerbi/api`.
credentials.type.powerbi.BEARER.warn = crit|An Entra token has 1,500 to 2,500 characters and expires after one hour: it does not fit in this field (255) and would stop working anyway. Switch to OAuth 2.0 with a service principal.
credentials.type.powerbi.BEARER.obtain.1 = A user token only comes from an interactive session (Azure CLI, browser) and cannot be renewed by the module.

credentials.type.rest.hint = Every mode is possible: the provider of the API dictates the right one.
credentials.type.rest.obtain.1 = In the provider's console: create a key or an application, and find in its documentation the header name or the token endpoint it expects.

credentials.type.gleif.NONE.send = No credential is added to the public GLEIF request.
credentials.type.gleif.NONE.code = GET /api/v1/lei-records?filter[lei]=...\nHost: api.gleif.org

credentials.type.vies.NONE.send = No credential is added to the public VIES validation request.
credentials.type.vies.NONE.code = POST /taxation_customs/vies/rest-api/check-vat-number\nHost: ec.europa.eu

credentials.type.salesforce.hint = Salesforce Connected App: client_credentials flow (recommended) or password.
credentials.type.salesforce.OAUTH2.apiKey = Consumer Secret
credentials.type.salesforce.OAUTH2.step.1.title = The Consumer Key
credentials.type.salesforce.OAUTH2.step.1.text  = Property `clientId`, in the Connected App.
credentials.type.salesforce.OAUTH2.step.2.title = The Consumer Secret
credentials.type.salesforce.OAUTH2.step.2.text  = Encrypted in "API key / token".
credentials.type.salesforce.OAUTH2.obtain.1 = Setup > App Manager > New Connected App: enable OAuth, tick "Enable Client Credentials Flow" and name the run-as user.
credentials.type.salesforce.OAUTH2.obtain.2 = Manage Consumer Details: Consumer Key -> clientId, Consumer Secret -> API key / token.

credentials.type.google-geocoding.hint = This connection manages its own key: authentication stays on "None", the key goes in "API key / token" and leaves as a query parameter.
credentials.type.google-geocoding.NONE.apiKey = Google Maps Platform key
credentials.type.google-geocoding.NONE.step.1.title = The Google key
credentials.type.google-geocoding.NONE.step.1.text  = Despite "None", this field is read: the connection appends it as `?key=` to every call.
credentials.type.google-geocoding.NONE.send = No header: the key is a URL parameter, added by the connection.
credentials.type.google-geocoding.NONE.code = GET /geocode/json?address=...&key=************
credentials.type.google-geocoding.obtain.1 = console.cloud.google.com > APIs & Services > Credentials > Create credentials > API key; restrict it to the Geocoding API.

credentials.type.loqate.hint = This connection manages its own key: authentication stays on "None", the key goes in "API key / token".
credentials.type.loqate.NONE.apiKey = Loqate key
credentials.type.loqate.NONE.step.1.title = The Loqate key
credentials.type.loqate.NONE.step.1.text  = Despite "None", this field is read: the connection sends it as the `Key` parameter of every call.
credentials.type.loqate.NONE.send = No header: the key is a parameter of the request, added by the connection.
credentials.type.loqate.NONE.code = GET /Capture/Interactive/Find/v1.10/json3.ws?Key=************&Text=...

credentials.type.melissa.hint = This connection manages its own key: authentication stays on "None", the license key goes in "API key / token".
credentials.type.melissa.NONE.apiKey = Melissa license key
credentials.type.melissa.NONE.step.1.title = The license key
credentials.type.melissa.NONE.step.1.text  = Despite "None", this field is read: the connection sends it as the `id` parameter of every call.
credentials.type.melissa.NONE.send = No header: the license key is a parameter of the request, added by the connection.
credentials.type.melissa.NONE.code = GET /v3/WEB/GlobalAddress/doGlobalAddress?id=************&a1=...

credentials.type.postgresql.hint = SQL account in HTTP Basic; with a JNDI data source, no credential here.
credentials.type.postgresql.BASIC.username = PostgreSQL role
credentials.type.postgresql.BASIC.step.1.title = The PostgreSQL role
credentials.type.postgresql.BASIC.step.1.text  = A read-only role is enough for an inbound flow.
credentials.type.postgresql.BASIC.step.2.title = Its password
credentials.type.postgresql.BASIC.step.2.text  = Or nothing at all when the `jndi` property is set.
credentials.type.postgresql.BASIC.send = The JDBC driver opens the session with this account; nothing goes over HTTP.
credentials.type.postgresql.BASIC.code = jdbc:postgresql://host:5432/database\nuser=...  password=****  (or a JNDI DataSource)
credentials.type.postgresql.obtain.1 = Ask the administrator for a dedicated role: `CREATE ROLE ebx_reader LOGIN PASSWORD '...'; GRANT SELECT ON ALL TABLES IN SCHEMA public TO ebx_reader;`

credentials.type.kafka.hint = "HTTP Basic" becomes SASL/PLAIN or SCRAM; "None" = PLAINTEXT or mTLS through the kafka.* properties.
credentials.type.kafka.BASIC.username = SASL user name
credentials.type.kafka.BASIC.password = SASL password
credentials.type.kafka.BASIC.step.1.title = The SASL identifier
credentials.type.kafka.BASIC.step.1.text  = With Confluent Cloud: the API key.
credentials.type.kafka.BASIC.step.2.title = The SASL secret
credentials.type.kafka.BASIC.step.2.text  = With Confluent Cloud: the API secret.
credentials.type.kafka.BASIC.send = SASL handshake when the connection opens; no HTTP header.
credentials.type.kafka.BASIC.code = security.protocol=SASL_SSL\nsasl.mechanism=PLAIN\nsasl.jaas.config=PlainLoginModule required username="..." password="****";
credentials.type.kafka.NONE.send = Plain or encrypted connection without an identity (mTLS possible through kafka.ssl.*).
credentials.type.kafka.NONE.code = security.protocol=PLAINTEXT
credentials.type.kafka.obtain.1 = Confluent Cloud: Cluster > API keys > Create key. Self-hosted Kafka: a SASL user created by the cluster operator.

credentials.type.hubspot.hint = Private app token: permanent, it fits in the field.
credentials.type.hubspot.BEARER.apiKey = Private app token
credentials.type.hubspot.BEARER.step.1.title = The pat-... token
credentials.type.hubspot.BEARER.step.1.text  = Generated once; it does not expire as long as the private app exists.
credentials.type.hubspot.BEARER.warn = good|Here the Bearer token is the right choice: HubSpot issues permanent tokens.
credentials.type.hubspot.obtain.1 = Settings > Integrations > Private apps > Create: tick the CRM scopes you need, then Show token.

credentials.type.slack.hint = Bot token of a Slack app (xoxb-...): stored encrypted, one connection for every channel the app may post to.
credentials.type.slack.BEARER.apiKey = Bot User OAuth Token
credentials.type.slack.BEARER.step.1.title = The xoxb-... token
credentials.type.slack.BEARER.step.1.text  = Shown once the app is installed in the workspace. Adding a scope asks for a reinstall.
credentials.type.slack.BEARER.warn = good|Here the Bearer token is the right choice: a bot token does not expire unless token rotation is turned on.
credentials.type.slack.obtain.1 = api.slack.com/apps > your app > OAuth & Permissions > Bot Token Scopes: chat:write, chat:write.public, channels:read, users:read.email (groups:read for private channels).
credentials.type.slack.obtain.2 = Same page: Install to Workspace, then copy the Bot User OAuth Token. Set the default channel in the property channel.

credentials.type.azure-service-bus.hint = This connection reads a complete connection string in "API key / token"; authentication stays on "None".
credentials.type.azure-service-bus.NONE.apiKey = Connection string
credentials.type.azure-service-bus.NONE.step.1.title = The whole connection string
credentials.type.azure-service-bus.NONE.step.1.text  = Must contain `Endpoint=sb://`, `SharedAccessKeyName=` and `SharedAccessKey=`.
credentials.type.azure-service-bus.NONE.send = The SDK signs every request with the shared key (SAS).
credentials.type.azure-service-bus.NONE.code = Authorization: SharedAccessSignature sr=...&sig=...&se=...&skn=<SharedAccessKeyName>
credentials.type.azure-service-bus.obtain.1 = Azure portal > Service Bus > Shared access policies: a dedicated Listen/Send policy, then "Primary Connection String".

credentials.type.llm.hint = Each provider has its header: Anthropic x-api-key, Google Gemini x-goog-api-key, Azure api-key; OpenAI and Mistral want Bearer (Bearer is translated for Anthropic and Gemini). A local Ollama needs nothing.
credentials.type.llm.API_KEY_HEADER.step.1.title = x-api-key, x-goog-api-key or api-key
credentials.type.llm.API_KEY_HEADER.step.1.text  = Lower case: x-api-key for Anthropic (the connection adds anthropic-version itself), x-goog-api-key for the Gemini API, api-key for Azure OpenAI and Azure AI Foundry.
credentials.type.llm.API_KEY_HEADER.step.2.title = The provider's key
credentials.type.llm.API_KEY_HEADER.step.2.text  = sk-ant-... (Anthropic), AIza... (Google AI Studio), the 32 or 84-character key of the Azure resource.
credentials.type.llm.NONE.step.1.title = Nothing to enter for Ollama
credentials.type.llm.NONE.step.1.text  = A local Ollama server (http://localhost:11434) has no authentication; pull the model first with ollama pull.
credentials.type.llm.NONE.obtain.1 = ollama.com/download, then ollama pull <model> on the server; the base URL is that server on port 11434.
credentials.type.llm.obtain.1 = console.anthropic.com > API keys > Create key (Anthropic); platform.openai.com > API keys (OpenAI, Bearer mode).
credentials.type.llm.obtain.2 = aistudio.google.com > Get API key (Gemini API); for Vertex AI a service account with the Vertex AI User role (OAUTH2).
credentials.type.llm.obtain.3 = Azure portal > Azure OpenAI (or Azure AI Foundry) resource > Keys and Endpoint; the model property is the deployment name.
credentials.type.llm.obtain.4 = console.mistral.ai > API Keys > Create new key (Mistral AI, Bearer mode).

# Record form of the ConnectorOperationalMetrics table (ConnectorMetricsForm)
metrics.form.creating = These rows are written by the connector runtime after each execution; there is normally no need to create one by hand.
metrics.tile.health = Health
metrics.tile.executions = Records processed
metrics.tile.executions.detail = {0} inbound · {1} outbound · {2} conflicts
metrics.tile.latency = Latency p50 / p95
metrics.tile.latency.detail = Over the last {0} samples (a batch gives the time per record)
metrics.tile.latency.none = No measurement yet
metrics.tile.updated = Last update
metrics.health.UNKNOWN = Unknown
metrics.health.HEALTHY = Healthy
metrics.health.DEGRADED = Degraded
metrics.health.FAILED = Failed
metrics.health.detail.unknown = No execution recorded yet
metrics.health.detail.healthy = Last success {0}
metrics.health.detail.failing = {0} consecutive failures, last one {1}
metrics.lastError = Last error:
metrics.age.never = never
metrics.age.now = just now
metrics.age.minutes = {0} min ago
metrics.age.hours = {0} h ago
metrics.age.days = {0} days ago
