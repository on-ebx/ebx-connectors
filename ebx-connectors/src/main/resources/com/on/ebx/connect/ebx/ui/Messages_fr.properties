designer.newPolicy.hint = Seulement si vide remplit un champ une fois : quand ce flux est relancé après un changement de la source, un champ déjà rempli garde sa valeur. Toujours écrase à chaque exécution, pour que ON EBX suive la source. Selon la confiance écrit quand cette source est au moins aussi fiable que celle qui a écrit la valeur. Les champs clés du flux restent en Seulement si vide. La politique de chaque règle reste modifiable dans le panneau de la règle.
