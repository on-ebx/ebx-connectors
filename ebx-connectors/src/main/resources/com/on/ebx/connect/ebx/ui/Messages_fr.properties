# Erreurs : cause et action suivante (audit C-38)
error.detail = D\u00e9tail technique
error.PRIVATE_ADDRESS.cause = La connexion vise une adresse priv\u00e9e, locale ou introuvable, que cette instance refuse par d\u00e9faut.
error.PRIVATE_ADDRESS.action = Demander \u00e0 un administrateur d\u2019ajouter l\u2019h\u00f4te \u00e0 {0} (ou de le nommer dans la liste des h\u00f4tes autoris\u00e9s), puis relancer.
error.HOST_NOT_ALLOWED.cause = L\u2019h\u00f4te de la connexion ne figure pas dans la liste des h\u00f4tes que les connexions peuvent appeler.
error.HOST_NOT_ALLOWED.action = Demander \u00e0 un administrateur d\u2019ajouter l\u2019h\u00f4te \u00e0 {0}, puis relancer.
error.CLEAR_SECRET.cause = Un secret de la connexion est stock\u00e9 en clair, ce que cette instance refuse par d\u00e9faut.
error.CLEAR_SECRET.action = Remplacer la valeur par une r\u00e9f\u00e9rence vault:, env: ou file: dans la connexion, puis relancer. Sur une instance de test seulement, un administrateur peut poser {0}=true.
error.RUN_ALREADY_RUNNING.cause = Ce mapping est d\u00e9j\u00e0 en cours d\u2019ex\u00e9cution. Rien n\u2019a \u00e9t\u00e9 d\u00e9marr\u00e9.
error.RUN_ALREADY_RUNNING.action = Attendre la fin de l\u2019ex\u00e9cution en cours, ou l\u2019arr\u00eater depuis son panneau, puis relancer.
error.TOO_MANY_RUNS.cause = L\u2019instance ex\u00e9cute ou met en attente d\u00e9j\u00e0 autant d\u2019ex\u00e9cutions en arri\u00e8re-plan qu\u2019elle en autorise. Rien n\u2019a \u00e9t\u00e9 d\u00e9marr\u00e9.
error.TOO_MANY_RUNS.action = Relancer quand une ex\u00e9cution est termin\u00e9e, ou demander \u00e0 un administrateur d\u2019augmenter {0}.
error.CONNECTION_REFUSED.cause = Le syst\u00e8me distant n\u2019a accept\u00e9 aucune connexion sur cette adresse et ce port.
error.CONNECTION_REFUSED.action = V\u00e9rifier l\u2019adresse et le port de la connexion et que le syst\u00e8me distant est d\u00e9marr\u00e9, puis tester la connexion.
error.HOST_UNKNOWN.cause = Le nom d\u2019h\u00f4te de la connexion n\u2019a pas pu \u00eatre r\u00e9solu.
error.HOST_UNKNOWN.action = V\u00e9rifier le nom d\u2019h\u00f4te de la connexion (orthographe, DNS, proxy), puis tester la connexion.
error.TIMEOUT.cause = Le syst\u00e8me distant n\u2019a pas r\u00e9pondu \u00e0 temps.
error.TIMEOUT.action = Relancer plus tard. Si cela se r\u00e9p\u00e8te, v\u00e9rifier le chemin r\u00e9seau et la charge du syst\u00e8me distant.
error.AUTH_REFUSED.cause = Le syst\u00e8me distant a refus\u00e9 les identifiants de la connexion, ou les droits qu\u2019ils donnent.
error.AUTH_REFUSED.action = V\u00e9rifier l\u2019utilisateur, le mot de passe, la cl\u00e9 ou le jeton de la connexion et les droits accord\u00e9s, puis tester la connexion.
error.RATE_LIMITED.cause = Le syst\u00e8me distant a demand\u00e9 de ralentir (trop de requ\u00eates).
error.RATE_LIMITED.action = Relancer plus tard, ou r\u00e9duire le volume de l\u2019ex\u00e9cution (un maximum plus bas, des entr\u00e9es plus cibl\u00e9es).
error.MAPPING_INVALID.cause = Le mapping demande quelque chose que sa connexion ou son op\u00e9ration ne sait pas faire.
error.MAPPING_INVALID.action = Ouvrir le mapping dans le concepteur et corriger ce que le d\u00e9tail technique nomme (sens, op\u00e9ration, r\u00e9glages incr\u00e9mentaux).
access.denied = Acc\u00e8s refus\u00e9 : {0} demande le droit Connectors {1}. Un administrateur EBX l''accorde \u00e0 l''un de vos r\u00f4les dans la table \u00ab Droits d''acc\u00e8s \u00bb du dataset Connectors (le r\u00f4le ''{2}'' l''a par d\u00e9faut).
access.right.READ = lecture
