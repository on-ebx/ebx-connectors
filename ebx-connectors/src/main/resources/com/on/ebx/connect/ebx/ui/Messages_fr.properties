credentials.mode.NONE.name    = Aucune
credentials.mode.NONE.short   = API publique, ou clé gérée par la connexion
credentials.mode.NONE.desc    = Aucun identifiant n'est ajouté aux requêtes. Certains types de connecteur restent sur « Aucune » tout en lisant une clé dans « Clé API / jeton », qu'ils envoient à leur façon : le guide le précise.
credentials.mode.NONE.send    = La requête part telle quelle.
credentials.mode.NONE.code    = GET /resource\nHost: point de terminaison configuré
credentials.mode.BASIC.name   = HTTP Basic
credentials.mode.BASIC.short  = Utilisateur + mot de passe
credentials.mode.BASIC.desc   = Le couple utilisateur / mot de passe est encodé en base64 et envoyé dans l'en-tête Authorization à chaque appel. C'est aussi le mode des bases de données (compte SQL).
credentials.mode.BASIC.step.1.title = Le compte technique
credentials.mode.BASIC.step.1.text  = Un utilisateur dédié au module, pas un compte personnel.
credentials.mode.BASIC.step.2.title = Son mot de passe
credentials.mode.BASIC.step.2.text  = Stocké chiffré ; ressaisissez-le après un changement chez le fournisseur.
credentials.mode.BASIC.send   = À chaque appel, sans jeton ni échange préalable.
credentials.mode.BASIC.code   = Authorization: Basic base64(utilisateur:mot de passe)
credentials.mode.API_KEY_HEADER.name  = Clé API dans un en-tête
credentials.mode.API_KEY_HEADER.short = Nom d'en-tête + clé
credentials.mode.API_KEY_HEADER.desc  = La clé est envoyée telle quelle, à chaque appel, dans l'en-tête HTTP dont vous donnez le nom. Le nom dépend du fournisseur : X-API-Key, x-api-key, Ocp-Apim-Subscription-Key, apikey...
credentials.mode.API_KEY_HEADER.step.1.title = Le nom de l'en-tête
credentials.mode.API_KEY_HEADER.step.1.text  = Exactement comme la documentation de l'API l'écrit ; la casse compte chez certains fournisseurs.
credentials.mode.API_KEY_HEADER.step.2.title = La clé
credentials.mode.API_KEY_HEADER.step.2.text  = Une clé longue durée, sans le préfixe « Bearer ».
credentials.mode.API_KEY_HEADER.send  = La clé ne change jamais ; révoquez-la chez le fournisseur pour la désactiver.
credentials.mode.API_KEY_HEADER.code  = {apiKeyHeader}: ************
credentials.mode.BEARER.name  = Jeton Bearer
credentials.mode.BEARER.short = Jeton déjà obtenu, statique
credentials.mode.BEARER.desc  = Vous collez un jeton obtenu ailleurs (jeton d'application privée, personal access token...). Le module l'envoie en Authorization: Bearer et ne le renouvelle jamais.
credentials.mode.BEARER.step.1.title = Le jeton, sans « Bearer »
credentials.mode.BEARER.step.1.text  = Un jeton permanent ou à longue durée de vie. Un jeton de session (Entra, Salesforce) expire en une à deux heures : préférez alors OAuth 2.0.
credentials.mode.BEARER.warn  = warn|Ce mode convient aux jetons permanents. Un jeton qui expire cessera de fonctionner sans prévenir, et ce champ accepte 255 caractères : un jeton Entra en fait 1 500 à 2 500.
credentials.mode.BEARER.send  = Le jeton part tel quel ; s'il expire, les appels répondent 401 jusqu'à ce que vous en colliez un nouveau.
credentials.mode.BEARER.code  = Authorization: Bearer ************
credentials.mode.OAUTH2.name  = OAuth 2.0
credentials.mode.OAUTH2.short = Le module obtient le jeton lui-même
credentials.mode.OAUTH2.desc  = Vous donnez l'identité de l'application (client id + secret) et le point de terminaison de jeton. Le module demande un jeton, le met en cache et le renouvelle une minute avant expiration. C'est le mode durable pour Microsoft, Salesforce, Databricks, D&B...
credentials.mode.OAUTH2.step.1.title = L'identifiant de l'application
credentials.mode.OAUTH2.step.1.text  = Propriété `clientId`. Public, il figure dans la console du fournisseur.
credentials.mode.OAUTH2.step.2.title = Le client secret
credentials.mode.OAUTH2.step.2.text  = Dans « Clé API / jeton », chiffré. Ce n'est pas un jeton : le module s'en sert pour en obtenir un.
credentials.mode.OAUTH2.step.3.title = Le point de terminaison de jeton
credentials.mode.OAUTH2.step.3.text  = Propriété `oauth.tokenUrl`. Certains types le déduisent (tenantId chez Microsoft) : il apparaît alors comme déduit.
credentials.mode.OAUTH2.send  = Un échange avec le serveur d'autorisation, puis le jeton obtenu sur chaque appel. Une réponse 401 invalide le cache et l'appel est rejoué une fois.
credentials.mode.OAUTH2.code  = POST {oauth.tokenUrl}\ngrant_type=client_credentials&client_id={clientId}&client_secret=****&scope=...\n\n-> Authorization: Bearer <access_token>   (cache, renouvelé 1 min avant expiration)

credentials.flow.password.step.1.title = L'utilisateur du flux password
credentials.flow.password.step.1.text  = Le compte au nom duquel le jeton est émis.
credentials.flow.password.step.2.title = Son mot de passe
credentials.flow.password.step.2.text  = Envoyé au point de terminaison de jeton, jamais à l'API.
credentials.flow.password.code = POST {oauth.tokenUrl}\ngrant_type=password&username=...&password=****&client_id={clientId}&client_secret=****\n\n-> Authorization: Bearer <access_token>
credentials.flow.refresh_token.step.1.title = Le refresh token
credentials.flow.refresh_token.step.1.text  = Propriété `oauth.refreshToken`, obtenue une fois par un consentement utilisateur ; le module en tire des access tokens.
credentials.flow.refresh_token.code = POST {oauth.tokenUrl}\ngrant_type=refresh_token&refresh_token=****&client_id={clientId}&client_secret=****\n\n-> Authorization: Bearer <access_token>
credentials.flow.jwt_bearer.step.1.title = La clé privée RSA
credentials.flow.jwt_bearer.step.1.text  = Propriété `oauth.privateKey` (PKCS#8 PEM, ou référence vault:/file:). Le module signe lui-même une assertion JWT ; aucun secret partagé.
credentials.flow.jwt_bearer.step.2.title = Le sujet (optionnel)
credentials.flow.jwt_bearer.step.2.text  = Utilisateur au nom duquel l'assertion est émise (`oauth.subject` sinon).
credentials.flow.jwt_bearer.code = POST {oauth.tokenUrl}\ngrant_type=urn:ietf:params:oauth:grant-type:jwt-bearer&assertion=<JWT signé RS256>\n\n-> Authorization: Bearer <access_token>

