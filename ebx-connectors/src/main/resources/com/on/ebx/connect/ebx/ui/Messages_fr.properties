credentials.type.powerbi.OAUTH2.step.1.title = Le tenant
credentials.type.powerbi.OAUTH2.step.1.text  = Propriété `tenantId` : Entra ID > Vue d'ensemble > Tenant ID.
credentials.type.powerbi.OAUTH2.step.2.title = L'application
credentials.type.powerbi.OAUTH2.step.2.text  = Propriété `clientId` : l'Application (client) ID de l'app registration.
credentials.type.powerbi.OAUTH2.step.3.title = Le client secret
credentials.type.powerbi.OAUTH2.step.3.text  = La Value copiée à la création du secret (pas le Secret ID).
credentials.type.powerbi.OAUTH2.obtain.1 = portal.azure.com > Microsoft Entra ID > App registrations > New registration (single tenant) : notez l'Application (client) ID.
credentials.type.powerbi.OAUTH2.obtain.2 = Certificates & secrets > New client secret : copiez la Value immédiatement.
credentials.type.powerbi.OAUTH2.obtain.3 = Créez un groupe de sécurité Entra et ajoutez-y le service principal.
credentials.type.powerbi.OAUTH2.obtain.4 = app.powerbi.com > Admin portal > Tenant settings : autorisez ce groupe pour « Service principals can use Fabric APIs » et les trois réglages Admin API (read-only, detailed metadata, DAX and mashup expressions).
credentials.type.powerbi.OAUTH2.obtain.5 = Ajoutez le service principal en membre de chaque espace de travail à cataloguer.
credentials.type.powerbi.OAUTH2.obtain.note = Comptez 15 minutes de propagation des réglages tenant. « Mon espace de travail » reste inaccessible à un service principal.
credentials.type.powerbi.BEARER.step.1.title = Un jeton Entra utilisateur
credentials.type.powerbi.BEARER.step.1.text  = Par exemple `az account get-access-token --resource https://analysis.windows.net/powerbi/api`.
credentials.type.powerbi.BEARER.warn = crit|Un jeton Entra fait 1 500 à 2 500 caractères et expire au bout d'une heure : il ne tient pas dans ce champ (255) et cesserait de fonctionner de toute façon. Passez en OAuth 2.0 avec un service principal.
credentials.type.powerbi.BEARER.obtain.1 = Un jeton utilisateur ne s'obtient qu'en session interactive (Azure CLI, navigateur) et ne peut pas être renouvelé par le module.

credentials.type.rest.hint = Tous les modes sont possibles : le fournisseur de l'API impose le bon.
credentials.type.rest.obtain.1 = Dans la console du fournisseur : créez une clé ou une application, et repérez dans sa documentation le nom de l'en-tête ou le point de terminaison de jeton attendu.

credentials.type.gleif.NONE.send = Aucun identifiant n'est ajouté à la requête publique GLEIF.
credentials.type.gleif.NONE.code = GET /api/v1/lei-records?filter[lei]=...\nHost: api.gleif.org

credentials.type.vies.NONE.send = Aucun identifiant n'est ajouté à la requête publique de validation VIES.
credentials.type.vies.NONE.code = POST /taxation_customs/vies/rest-api/check-vat-number\nHost: ec.europa.eu

credentials.type.salesforce.hint = Connected App Salesforce : flux client_credentials (recommandé) ou password.
credentials.type.salesforce.OAUTH2.apiKey = Consumer Secret
credentials.type.salesforce.OAUTH2.step.1.title = La Consumer Key
credentials.type.salesforce.OAUTH2.step.1.text  = Propriété `clientId`, dans la Connected App.
credentials.type.salesforce.OAUTH2.step.2.title = Le Consumer Secret
credentials.type.salesforce.OAUTH2.step.2.text  = Chiffré dans « Clé API / jeton ».
credentials.type.salesforce.OAUTH2.obtain.1 = Setup > App Manager > New Connected App : activez OAuth, cochez « Enable Client Credentials Flow » et désignez l'utilisateur d'exécution.
credentials.type.salesforce.OAUTH2.obtain.2 = Manage Consumer Details : Consumer Key -> clientId, Consumer Secret -> Clé API / jeton.

credentials.type.google-geocoding.hint = Cette connexion gère elle-même sa clé : l'authentification reste sur « Aucune », la clé va dans « Clé API / jeton » et part en paramètre de requête.
credentials.type.google-geocoding.NONE.apiKey = Clé Google Maps Platform
credentials.type.google-geocoding.NONE.step.1.title = La clé Google
credentials.type.google-geocoding.NONE.step.1.text  = Malgré « Aucune », ce champ est lu : la connexion l'ajoute en `?key=` à chaque appel.
credentials.type.google-geocoding.NONE.send = Pas d'en-tête : la clé est un paramètre de l'URL, ajouté par la connexion.
credentials.type.google-geocoding.NONE.code = GET /geocode/json?address=...&key=************
credentials.type.google-geocoding.obtain.1 = console.cloud.google.com > APIs & Services > Credentials > Create credentials > API key ; restreignez-la à l'API Geocoding.

credentials.type.loqate.hint = Cette connexion gère elle-même sa clé : l'authentification reste sur « Aucune », la clé va dans « Clé API / jeton ».
credentials.type.loqate.NONE.apiKey = Clé Loqate
credentials.type.loqate.NONE.step.1.title = La clé Loqate
credentials.type.loqate.NONE.step.1.text  = Malgré « Aucune », ce champ est lu : la connexion l'envoie en paramètre `Key` de chaque appel.
credentials.type.loqate.NONE.send = Pas d'en-tête : la clé est un paramètre de la requête, ajouté par la connexion.
credentials.type.loqate.NONE.code = GET /Capture/Interactive/Find/v1.10/json3.ws?Key=************&Text=...

credentials.type.melissa.hint = Cette connexion gère elle-même sa clé : l'authentification reste sur « Aucune », la clé de licence va dans « Clé API / jeton ».
credentials.type.melissa.NONE.apiKey = Clé de licence Melissa
credentials.type.melissa.NONE.step.1.title = La clé de licence
credentials.type.melissa.NONE.step.1.text  = Malgré « Aucune », ce champ est lu : la connexion l'envoie en paramètre `id` de chaque appel.
credentials.type.melissa.NONE.send = Pas d'en-tête : la clé de licence est un paramètre de la requête, ajouté par la connexion.
credentials.type.melissa.NONE.code = GET /v3/WEB/GlobalAddress/doGlobalAddress?id=************&a1=...

credentials.type.postgresql.hint = Compte SQL en HTTP Basic ; avec une source JNDI, aucun identifiant ici.
credentials.type.postgresql.BASIC.username = Rôle PostgreSQL
credentials.type.postgresql.BASIC.step.1.title = Le rôle PostgreSQL
credentials.type.postgresql.BASIC.step.1.text  = Un rôle en lecture seule suffit pour un flux entrant.
credentials.type.postgresql.BASIC.step.2.title = Son mot de passe
credentials.type.postgresql.BASIC.step.2.text  = Ou rien du tout si la propriété `jndi` est renseignée.
credentials.type.postgresql.BASIC.send = Le pilote JDBC ouvre la session avec ce compte ; rien ne transite en HTTP.
credentials.type.postgresql.BASIC.code = jdbc:postgresql://host:5432/database\nuser=...  password=****  (ou DataSource JNDI)
credentials.type.postgresql.obtain.1 = Demandez à l'administrateur un rôle dédié : `CREATE ROLE ebx_reader LOGIN PASSWORD '...'; GRANT SELECT ON ALL TABLES IN SCHEMA public TO ebx_reader;`

credentials.type.kafka.hint = « HTTP Basic » devient SASL/PLAIN ou SCRAM ; « Aucune » = PLAINTEXT ou mTLS via les propriétés kafka.*.
credentials.type.kafka.BASIC.username = Utilisateur SASL
credentials.type.kafka.BASIC.password = Mot de passe SASL
credentials.type.kafka.BASIC.step.1.title = L'identifiant SASL
credentials.type.kafka.BASIC.step.1.text  = Avec Confluent Cloud : la clé d'API.
credentials.type.kafka.BASIC.step.2.title = Le secret SASL
credentials.type.kafka.BASIC.step.2.text  = Avec Confluent Cloud : le secret d'API.
credentials.type.kafka.BASIC.send = Handshake SASL à l'ouverture de la connexion ; pas d'en-tête HTTP.
credentials.type.kafka.BASIC.code = security.protocol=SASL_SSL\nsasl.mechanism=PLAIN\nsasl.jaas.config=PlainLoginModule required username="..." password="****";
credentials.type.kafka.NONE.send = Connexion en clair ou chiffrée sans identité (mTLS possible via kafka.ssl.*).
credentials.type.kafka.NONE.code = security.protocol=PLAINTEXT
credentials.type.kafka.obtain.1 = Confluent Cloud : Cluster > API keys > Create key. Kafka auto-hébergé : un utilisateur SASL créé par l'exploitant du cluster.

credentials.type.hubspot.hint = Jeton d'application privée : permanent, il tient dans le champ.
credentials.type.hubspot.BEARER.apiKey = Jeton d'application privée
credentials.type.hubspot.BEARER.step.1.title = Le jeton pat-...
credentials.type.hubspot.BEARER.step.1.text  = Généré une fois ; il ne périme pas tant que l'application privée existe.
credentials.type.hubspot.BEARER.warn = good|Ici le jeton Bearer est le bon choix : HubSpot émet des jetons permanents.
credentials.type.hubspot.obtain.1 = Settings > Integrations > Private apps > Create : cochez les scopes CRM nécessaires, puis Show token.

credentials.type.slack.hint = Jeton de bot d'une application Slack (xoxb-...) : stocké chiffré, une seule connexion pour tous les canaux où l'application peut écrire.
credentials.type.slack.BEARER.apiKey = Bot User OAuth Token
credentials.type.slack.BEARER.step.1.title = Le jeton xoxb-...
credentials.type.slack.BEARER.step.1.text  = Affiché une fois l'application installée dans l'espace de travail. Ajouter un scope demande de la réinstaller.
credentials.type.slack.BEARER.warn = good|Ici le jeton Bearer est le bon choix : un jeton de bot ne périme pas, sauf si la rotation des jetons est activée.
credentials.type.slack.obtain.1 = api.slack.com/apps > votre application > OAuth & Permissions > Bot Token Scopes : chat:write, chat:write.public, channels:read, users:read.email (groups:read pour les canaux privés).
credentials.type.slack.obtain.2 = Même page : Install to Workspace, puis copiez le Bot User OAuth Token. Le canal par défaut se règle dans la propriété channel.

credentials.type.azure-service-bus.hint = Cette connexion lit une chaîne de connexion complète dans « Clé API / jeton », l'authentification reste sur « Aucune ».
credentials.type.azure-service-bus.NONE.apiKey = Chaîne de connexion
credentials.type.azure-service-bus.NONE.step.1.title = La chaîne de connexion entière
credentials.type.azure-service-bus.NONE.step.1.text  = Doit contenir `Endpoint=sb://`, `SharedAccessKeyName=` et `SharedAccessKey=`.
credentials.type.azure-service-bus.NONE.send = Le SDK signe chaque requête avec la clé partagée (SAS).
credentials.type.azure-service-bus.NONE.code = Authorization: SharedAccessSignature sr=...&sig=...&se=...&skn=<SharedAccessKeyName>
credentials.type.azure-service-bus.obtain.1 = Portail Azure > Service Bus > Shared access policies : une stratégie Listen/Send dédiée, puis « Primary Connection String ».

credentials.type.llm.hint = Chaque fournisseur a son en-tête : Anthropic x-api-key, Google Gemini x-goog-api-key, Azure api-key ; OpenAI et Mistral la veulent en Bearer (Bearer est traduit pour Anthropic et Gemini). Un Ollama local ne demande rien.
credentials.type.llm.API_KEY_HEADER.step.1.title = x-api-key, x-goog-api-key ou api-key
credentials.type.llm.API_KEY_HEADER.step.1.text  = En minuscules : x-api-key pour Anthropic (la connexion ajoute anthropic-version elle-même), x-goog-api-key pour l'API Gemini, api-key pour Azure OpenAI et Azure AI Foundry.
credentials.type.llm.API_KEY_HEADER.step.2.title = La clé du fournisseur
credentials.type.llm.API_KEY_HEADER.step.2.text  = sk-ant-... (Anthropic), AIza... (Google AI Studio), la clé de 32 ou 84 caractères de la ressource Azure.
credentials.type.llm.NONE.step.1.title = Rien à saisir pour Ollama
credentials.type.llm.NONE.step.1.text  = Un serveur Ollama local (http://localhost:11434) n'a pas d'authentification ; téléchargez d'abord le modèle avec ollama pull.
credentials.type.llm.NONE.obtain.1 = ollama.com/download, puis ollama pull <modèle> sur le serveur ; l'URL de base est ce serveur, port 11434.
credentials.type.llm.obtain.1 = console.anthropic.com > API keys > Create key (Anthropic) ; platform.openai.com > API keys (OpenAI, mode Bearer).
credentials.type.llm.obtain.2 = aistudio.google.com > Get API key (API Gemini) ; pour Vertex AI, un compte de service avec le rôle Vertex AI User (OAUTH2).
credentials.type.llm.obtain.3 = Portail Azure > ressource Azure OpenAI (ou Azure AI Foundry) > Keys and Endpoint ; la propriété model est le nom du déploiement.
credentials.type.llm.obtain.4 = console.mistral.ai > API Keys > Create new key (Mistral AI, mode Bearer).

